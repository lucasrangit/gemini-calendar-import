<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/YOUR_EXEC_ID/exec">
  <title>Redirecting...</title>
  <script>
    // Preserves any incoming query parameters
    const targetUrl = new URL("https://script.google.com/macros/s/YOUR_EXEC_ID/exec");
    const currentParams = new URLSearchParams(window.location.search);
    currentParams.forEach((val, key) => targetUrl.searchParams.set(key, val));
    window.location.replace(targetUrl.toString());
  </script>
</head>
<body>
  <p>Redirecting to application... <a href="https://script.google.com/macros/s/YOUR_EXEC_ID/exec">Click here if not redirected</a>.</p>
</body>
</html>
